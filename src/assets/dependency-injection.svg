<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spring IoC container injecting dependencies into a service through its constructor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2337ff"/>
      <stop offset="1" stop-color="#000d8a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2337ff"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#60739f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- IoC container -->
  <g filter="url(#soft)">
    <rect x="70" y="150" width="360" height="300" rx="20" fill="#ffffff" stroke="#e5e9f0" stroke-width="2"/>
  </g>
  <rect x="70" y="150" width="360" height="56" rx="20" fill="url(#accent)"/>
  <rect x="70" y="176" width="360" height="30" fill="url(#accent)"/>
  <text x="250" y="188" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#ffffff">Spring IoC Container</text>

  <!-- Beans inside the container -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700">
    <g>
      <circle cx="150" cy="270" r="34" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5"/>
      <text x="150" y="278" text-anchor="middle" fill="#2337ff">Repo</text>
    </g>
    <g>
      <circle cx="250" cy="360" r="34" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5"/>
      <text x="250" y="368" text-anchor="middle" fill="#2337ff">Cache</text>
    </g>
    <g>
      <circle cx="350" cy="270" r="34" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5"/>
      <text x="350" y="278" text-anchor="middle" fill="#2337ff">Client</text>
    </g>
  </g>

  <!-- Injection arrows -->
  <g stroke="#2337ff" stroke-width="3.5" fill="none">
    <path d="M188 262 C 320 210, 560 210, 700 245" marker-end="url(#arrow)"/>
    <path d="M288 352 C 460 330, 600 320, 700 305" marker-end="url(#arrow)"/>
    <path d="M388 278 C 520 300, 600 340, 700 360" marker-end="url(#arrow)"/>
  </g>
  <text x="560" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#60739f">injects via constructor</text>

  <!-- Target service -->
  <g filter="url(#soft)">
    <rect x="710" y="210" width="420" height="180" rx="18" fill="#0f1219"/>
  </g>
  <text x="740" y="258" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" fill="#7c9cff">class</text>
  <text x="806" y="258" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" fill="#e1e4e8" font-weight="700">OrderService</text>
  <text x="740" y="300" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#e1e4e8">OrderService(</text>
  <text x="770" y="330" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#9be9a8">Repo, Cache, Client</text>
  <text x="740" y="360" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#e1e4e8">) { ... }</text>

  <!-- Title -->
  <text x="600" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0f1219">Dependency Injection</text>
  <text x="600" y="545" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#60739f">the container wires your objects together at run time</text>
</svg>
